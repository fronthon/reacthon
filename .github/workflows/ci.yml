name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the deploy job needs Pages write / id-token; the others just read the
# repo (same split as the other repos).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reacthon is developed against its neighbours, ../brycomp, ../bryntime and
  # ../bryvend: they are checked out beside it, Brycomp and Bryntime installed
  # with their own link to ../bryvend. CPython 3.14 is the oracle of the
  # formats and of the walrus over its own library.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: reacthon

      - name: Checkout the neighbours
        run: |
          git clone --depth 1 https://github.com/svelthon/bryvend.git
          git clone --depth 1 https://github.com/svelthon/bryntime.git
          git clone --depth 1 https://github.com/svelthon/brycomp.git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install
        run: |
          npm ci --prefix bryntime
          npm ci --prefix brycomp
          npm ci --prefix reacthon

      - name: Test
        working-directory: reacthon
        run: npm test

  # The demo is built from demos/ with paths relative to its page, so it is
  # served as well under the repository's name. Only from main, and only once
  # the tests pass.
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: reacthon

      - name: Checkout the neighbours
        run: |
          git clone --depth 1 https://github.com/svelthon/bryvend.git
          git clone --depth 1 https://github.com/svelthon/bryntime.git
          git clone --depth 1 https://github.com/svelthon/brycomp.git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          npm ci --prefix bryntime
          npm ci --prefix brycomp
          npm ci --prefix reacthon

      - name: Build the demo
        working-directory: reacthon
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reacthon/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
